# Create a render.yaml file
cat > render.yaml << 'EOF'
services:
  - type: web
    name: conda-chat
    runtime: node
    repo: https://github.com/sweepingedge4080/CONDA
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
EOF
